# Generates and uploads SBOMs for the published docker images (server, webui).
name: Generate SBOM (docker image)

on:
  # Called from release.yml once the images are pushed. A registry_package
  # trigger cannot be used here: release.yml pushes with GITHUB_TOKEN, and
  # events triggered by GITHUB_TOKEN do not start new workflow runs.
  workflow_call:
    inputs:
      image:
        description: "Image on ghcr.io/eclipse-openvsx to scan"
        required: true
        type: string
      version:
        description: "Version tag (e.g. v1.2.3)"
        required: true
        type: string
  # Backfill an SBOM for an image that is already published.
  workflow_dispatch:
    inputs:
      image:
        description: "Image on ghcr.io/eclipse-openvsx to scan"
        required: true
        type: choice
        options:
          - openvsx-server
          - openvsx-webui
      version:
        description: "Version tag (e.g. v1.2.3)"
        required: true

permissions:
  id-token: write  # required for OIDC-authenticated SBOM upload

env:
  REGISTRY: ghcr.io
  OWNER: eclipse-openvsx
  NAME: "${{ inputs.image }}"
  VERSION: "${{ inputs.version }}"

jobs:
  sbom-docker:
    # * Called only from release.yml, so only release images are scanned;
    #   the snapshot images built by main.yml never reach this workflow.
    # * Manual dispatch is allowed on forks, but also uses upstream registry
    #   images. Image names are restricted by the input field.
    if: github.event_name == 'workflow_dispatch' || github.repository_owner == 'eclipse-openvsx'
    runs-on: ubuntu-latest
    steps:
    - name: Generate SBOM
      uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
      with:
        image: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.NAME }}:${{ env.VERSION }}
        output-file: sbom.json
        format: cyclonedx-json
        upload-artifact: false

    - name: Upload SBOM
      uses: eclipse-csi/workflows/upload-sbom@a5993190de939557abd37e9d7a7ecfee80660876
      with:
        sbom-file: sbom.json
        # NOTE: Upload will fail for a non-registered 'product-name'.
        # See https://github.com/eclipse-csi/workflows#upload-sbom for details.
        product-name: "${{ env.NAME }} docker image"
        product-version: ${{ env.VERSION }}
