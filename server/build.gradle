plugins {
    id 'java'
    id 'scala'
    id 'jacoco'
    alias(libs.plugins.jooq.codegen)
    alias(libs.plugins.download)
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.spring.dependency.management)
    alias(libs.plugins.hibernate.orm)
    alias(libs.plugins.test.logger)
    alias(libs.plugins.gatling)
    alias(libs.plugins.rewrite)
    alias(libs.plugins.spotless)
    id 'maven-publish'
}

def jooqSrcDir = 'src/main/jooq-gen'

// override spring boot managed versions
// see https://docs.spring.io/spring-boot/gradle-plugin/managing-dependencies.html
// example:
// ext['netty.version'] = '4.1.132.Final'

// Note: these versions below "deviate" from Spring Boot's managed versions because we want to use newer versions
// This means that on Spring Boot update, we need to re-check the versions here and update or remove them if needed.
//
// scripts/dependency-override-check.sh discovers this ext[...] block itself and fails if any entry
// has fallen behind the version Spring Boot's BOM manages; run it with --latest to also
// (non-fatally) check them against the latest upstream releases. Nothing to update there when
// adding or removing an override here.

ext['flyway.version'] = libs.versions.flyway.get()
ext['httpclient5.version'] = libs.versions.httpclient5.get()
ext['httpcore5.version'] = libs.versions.httpcore5.get()
ext['jackson-2-bom.version'] = libs.versions.jackson2.get()
ext['jackson-bom.version'] = libs.versions.jackson.get()
ext['jetty.version'] = libs.versions.jetty.get()
ext['jooq.version'] = libs.versions.jooq.get()
ext['log4j2.version'] = libs.versions.log4j2.get()
ext['logback.version'] = libs.versions.logback.get()
ext['netty.version'] = libs.versions.netty.get()
ext['opentelemetry.version'] = libs.versions.opentelemetry.get()
ext['postgresql.version'] = libs.versions.postgresql.get()

java {
    sourceCompatibility = libs.versions.java.get()
}

repositories {
    mavenCentral()
}

// The 'dev' source set contains the development setup. These files are not included in the jar.
sourceSets {
    main {
        java.srcDirs += jooqSrcDir
    }
    dev {
        compileClasspath += main.output
        runtimeClasspath += main.output
    }
}

configurations {
    devImplementation.extendsFrom implementation
    devRuntimeOnly.extendsFrom runtimeOnly

    testImplementation.exclude group: 'com.vaadin.external.google', module: 'android-json'
}

dependencies {
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-starter-jetty"
    modules {
        module("org.springframework.boot:spring-boot-starter-tomcat") {
            replacedBy("org.springframework.boot:spring-boot-starter-jetty")
        }
    }
    // Only a transitive runtime dependency of spring-boot-starter-jetty otherwise; needed at compile
    // time to reconfigure the installed CompressionHandler in VSCodeGalleryCompressionConfig.
    implementation "org.eclipse.jetty.compression:jetty-compression-server"
    implementation "org.springframework.boot:spring-boot-starter-restclient"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-jooq"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-data-elasticsearch"
    implementation "org.springframework.boot:spring-boot-starter-data-redis"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-zipkin"
    implementation "org.springframework.boot:spring-boot-starter-session-jdbc"
    implementation "org.springframework.boot:spring-boot-starter-restclient"

    implementation "org.springframework.boot:spring-boot-security-oauth2-client"
    implementation "org.springframework.security:spring-security-oauth2-jose"

    // Depend directly on Thymeleaf rather than org.springframework.boot:spring-boot-thymeleaf
    // (the autoconfiguration module - see JacksonConfig-adjacent notes in MailConfig): the app
    // only uses Thymeleaf for rendering mail templates and builds its own SpringTemplateEngine
    // bean for that, so ThymeleafAutoConfiguration's ThymeleafViewResolver (which would resolve
    // Spring MVC view names, e.g. the "error" view, through the same mail template resolver)
    // never needs to exist in the first place. No spring.autoconfigure.exclude required.
    implementation "org.thymeleaf:thymeleaf-spring6"

    implementation "org.apache.httpcomponents.client5:httpclient5"
    implementation "com.github.ben-manes.caffeine:caffeine"
    implementation 'com.github.ben-manes.caffeine:jcache'

    implementation "io.micrometer:micrometer-tracing"
    implementation "io.micrometer:micrometer-tracing-bridge-otel"
    implementation "io.opentelemetry:opentelemetry-exporter-zipkin"

    implementation libs.commons.lang3
    implementation libs.bouncycastle
    implementation libs.jedis
    implementation libs.guava
    implementation libs.uuid.generator

    implementation libs.bucket4j.spring
    implementation libs.bucket4j.redis
    implementation libs.ipaddress

    implementation libs.jobrunr.spring

    implementation "org.springframework.boot:spring-boot-flyway"
    implementation libs.flyway.core
    implementation libs.flyway.database.postgresql

    implementation libs.google.cloud.storage
    implementation libs.azure.storage.blob
    implementation libs.awssdk.s3
    implementation libs.awssdk.sts

    implementation libs.springdoc

    implementation libs.jackson.dataformat.yaml
    implementation libs.jackson.dataformat.xml
    implementation libs.jackson.dataformat.toml

    implementation libs.woodstox.core

    implementation libs.jaxb.api
    implementation libs.jaxb.impl

    implementation libs.tika.core
    implementation libs.re2j
    implementation libs.loki.logback.appender

    runtimeOnly "io.micrometer:micrometer-registry-prometheus"
    runtimeOnly "org.postgresql:postgresql"
    jooqCodegen "org.postgresql:postgresql"

    // to aid migration from 3.5 to 4.0
    runtimeOnly "org.springframework.boot:spring-boot-properties-migrator"

    devRuntimeOnly "org.springframework.boot:spring-boot-devtools"

    testImplementation("org.springframework.boot:spring-boot-starter-test") {
        exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
    }
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.security:spring-security-test"

    testImplementation "org.springframework.boot:spring-boot-testcontainers"
    testImplementation libs.testcontainers.elasticsearch
    testImplementation libs.testcontainers.localstack
    testImplementation libs.testcontainers.junit.jupiter
    testImplementation libs.testcontainers.postgresql

    gatling libs.gatling.core
    gatling libs.gatling.app

    rewrite libs.rewrite.java
}

configurations.configureEach {
    resolutionStrategy {
        // due to security vulnerabilities in commons-compress < 1.26.0
        // see: https://commons.apache.org/proper/commons-compress/security.html
        force 'org.apache.commons:commons-compress:[1.26.0,2.0)'
        // pulled in from elasticsearch-java, resolution rule added because of CVE-2026-9563
        force 'org.eclipse.parsson:parsson:[1.1.8,2.0)'
    }
}

jooq {
    configuration {
        logging = "WARN"
        jdbc {
            driver = 'org.postgresql.Driver'
            url = 'jdbc:postgresql://localhost:5432/postgres'
            user = 'openvsx'
            password = 'openvsx'
        }
        generator {
            name = 'org.jooq.codegen.DefaultGenerator'
            database {
                name = 'org.jooq.meta.postgres.PostgresDatabase'
                inputSchema = 'public'
                includes = '.*'
                // jobrunr's and flyway's own bookkeeping tables. They are owned by those tools,
                // nothing here queries them, and flyway_schema_history in particular only exists in
                // a database flyway has already migrated - so generating it makes the committed
                // output depend on how the schema was built rather than on the migrations.
                excludes = 'jobrunr.*|flyway_schema_history'
                includeRoutines = false
            }
            target {
                packageName = 'org.eclipse.openvsx.jooq'
                directory = jooqSrcDir
            }
            generate {
                implicitJoinPathsToOne = false
                implicitJoinPathsToMany = false
                implicitJoinPathUnusedConstructors = false
                implicitJoinPathsUseTableNameForUnambiguousFKs = false
                implicitJoinPathsAsKotlinProperties = false
            }
        }
    }
}

rewrite {
    activeRecipe("org.openrewrite.java.jspecify.MigrateFromJakartaAnnotationApi")
    setExportDatatables(true)
}

publishing {
    publications {
        maven(MavenPublication) {
            artifact ('scripts/run-server.sh')
            artifact bootJar
        }
    }
}

spotless {
    // keep spotlessCheck/spotlessApply opt-in only - do not gate check/build/test on formatting
    enforceCheck = false

    // optional: limit format enforcement to just the files changed by this feature branch
    // ratchetFrom 'origin/main'

    java {
        // matches jbang-fmt.args: only server non-generated sources, excludes jooq-gen
        target 'src/main/java/**/*.java', 'src/test/java/**/*.java'

        // shared with scripts/ImportSort.java (the jbang path) so both stay in sync
        importOrderFile('config/import-order.importorder')

        // shared with scripts/AddBracesFix.java (the jbang path) via buildSrc, see
        // buildSrc/src/main/java/AddBracesFixStep.java - runs before the Eclipse
        // formatter step below so the braces it adds get properly indented/positioned
        addStep(AddBracesFixStep.create())

        eclipse('4.40').configFile('config/eclipse-java-formatter.xml')

        // shared with scripts/ClosingBraceFix.java (the jbang path) via buildSrc,
        // see buildSrc/src/main/java/ClosingBraceFixStep.java
        addStep(ClosingBraceFixStep.create())
    }
}

tasks.register('runServer', JavaExec) {
    jvmArgs = [
        '-Dorg.jooq.no-logo=true',
        '-Dorg.jooq.no-tips=true',
        '--enable-native-access=ALL-UNNAMED' // due to https://github.com/netty/netty/issues/15161
    ]
    classpath = sourceSets.dev.runtimeClasspath
    mainClass = 'org.eclipse.openvsx.RegistryApplication'
}

testlogger {
    // By default only frames of the test class itself are shown, which hides where a failure
    // actually originated - useless for diagnosing failures that only reproduce on CI.
    showFullStackTraces = true
}

test {
    // -Xmx raised from 4096m: the full suite caches many distinct Spring test contexts
    // (@SpringBootTest/@WebMvcTest each get their own), and 4 GB was occasionally too tight,
    // observed as an OutOfMemoryError during unrelated context bootstrapping on CI.
    jvmArgs = ['--enable-native-access=ALL-UNNAMED', '-Xmx6144m', '-Xshare:off'] // due to https://github.com/netty/netty/issues/15161
    useJUnitPlatform()

    // registry tests run on plain postgres, analytics tests on timescale/timescaledb; override
    // either image with -Dovsx.test.postgres.image=... / -Dovsx.test.timeseries.image=...
    ['ovsx.test.postgres.image', 'ovsx.test.timeseries.image'].each { property ->
        if (System.getProperty(property) != null) {
            systemProperty property, System.getProperty(property)
        }
    }
}

tasks.register('unitTests', Test) {
    description = 'Runs unit tests (excluding container-backed integration tests).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Exclude container-backed tests by tag rather than a hand-maintained class list: any test that
    // extends AbstractPostgresContainerTest (or is otherwise tagged "integration") is skipped here, so
    // this fast task never spins up a Docker container. New integration tests are covered automatically.
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

tasks.register('s3IntegrationTests', Test) {
    description = 'Runs S3 integration tests using LocalStack (requires Docker/Podman).'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Select S3 integration tests by tag rather than a hardcoded class name, so new tests tagged "s3"
    // are picked up automatically.
    useJUnitPlatform {
        includeTags 's3'
    }

    // Set system properties for test configuration
    systemProperty 'spring.profiles.active', 's3-integration'
}

jacocoTestReport {
    reports {
        xml.required = true
    }

    dependsOn test // tests are required to run before generating the report
}

tasks.withType(ScalaCompile).configureEach {
    scalaCompileOptions.forkOptions.with {
        jvmArgs = ['-Xss100m'] // Scala compiler may require a larger stack size when compiling Gatling simulations
    }
}

import io.gatling.gradle.GatlingRunTask

// Per-simulation GatlingRunTask instances. Aggregator tasks below pull them
// in via dependsOn. The plugin's includes/excludes filter isn't exposed
// per-task, so we register one task per simulation explicitly.
def gatlingSimulationGroups = [
    fillDatabase: [
        'org.eclipse.openvsx.RegistryAPICreateNamespaceSimulation',
        'org.eclipse.openvsx.RegistryAPIPublishExtensionSimulation',
    ],
    registryApi: [
        'org.eclipse.openvsx.RegistryAPIGetNamespaceSimulation',
        'org.eclipse.openvsx.RegistryAPIGetNamespaceDetailsSimulation',
        'org.eclipse.openvsx.RegistryAPIGetExtensionSimulation',
        'org.eclipse.openvsx.RegistryAPIGetExtensionTargetPlatformSimulation',
        'org.eclipse.openvsx.RegistryAPIGetExtensionVersionSimulation',
        'org.eclipse.openvsx.RegistryAPIGetExtensionVersionTargetPlatformSimulation',
        'org.eclipse.openvsx.RegistryAPIGetVersionReferencesSimulation',
        'org.eclipse.openvsx.RegistryAPIGetVersionReferencesTargetPlatformSimulation',
        'org.eclipse.openvsx.RegistryAPIGetFileSimulation',
        'org.eclipse.openvsx.RegistryAPIGetFileTargetPlatformSimulation',
        'org.eclipse.openvsx.RegistryAPIGetQuerySimulation',
        'org.eclipse.openvsx.RegistryAPIGetQueryV2Simulation',
        'org.eclipse.openvsx.RegistryAPISearchSimulation',
        'org.eclipse.openvsx.RegistryAPIVerifyTokenSimulation',
    ],
    vscodeAdapter: [
        'org.eclipse.openvsx.adapter.VSCodeAdapterExtensionQuerySimulation',
        'org.eclipse.openvsx.adapter.VSCodeAdapterGetAssetSimulation',
        'org.eclipse.openvsx.adapter.VSCodeAdapterGetWebResourceSimulation',
        'org.eclipse.openvsx.adapter.VSCodeAdapterItemSimulation',
        'org.eclipse.openvsx.adapter.VSCodeAdapterUnpkgSimulation',
        'org.eclipse.openvsx.adapter.VSCodeAdapterVspackageSimulation',
    ],
]

def simTaskName = { String fqcn -> "gatling${fqcn.tokenize('.').last()}" as String }

gatlingSimulationGroups.values().flatten().each { String fqcn ->
    tasks.register(simTaskName(fqcn), GatlingRunTask) {
        simulationClassName = fqcn
        nonInteractive = true
    }
}

// Within fillDatabase, namespaces must be created before extensions can be published.
tasks.named(simTaskName('org.eclipse.openvsx.RegistryAPIPublishExtensionSimulation')).configure {
    mustRunAfter simTaskName('org.eclipse.openvsx.RegistryAPICreateNamespaceSimulation')
}

tasks.register('perfFillDatabase') {
    description = 'Populates the DB: creates namespaces then publishes extensions'
    group = 'Performance testing'
    dependsOn gatlingSimulationGroups.fillDatabase.collect(simTaskName)
}

tasks.register('perfTestRegistryApi') {
    description = 'Runs read-only Gatling simulations against the registry API'
    group = 'Performance testing'
    dependsOn gatlingSimulationGroups.registryApi.collect(simTaskName)
}

tasks.register('perfTestVscodeAdapter') {
    description = 'Runs read-only Gatling simulations against the VS Code adapter'
    group = 'Performance testing'
    dependsOn gatlingSimulationGroups.vscodeAdapter.collect(simTaskName)
}

tasks.register('perfTestAll') {
    description = 'Runs all read-only Gatling simulations (registry API + VS Code adapter)'
    group = 'Performance testing'
    dependsOn 'perfTestRegistryApi', 'perfTestVscodeAdapter'
}

apply from: 'dependencies.gradle'
apply from: 'test-extensions.gradle'
