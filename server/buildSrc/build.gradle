plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

// ClosingBraceFixCore.java is shared with scripts/ClosingBraceFix.java (the jbang path) -
// compiled from the same source here rather than copied, so both stay in sync.
sourceSets {
    main {
        java {
            srcDir '../scripts/src'
        }
    }
}

dependencies {
    // must match the spotless-lib version pulled in transitively by the
    // com.diffplug.spotless plugin version applied in the main build (see build.gradle) -
    // check that plugin version's POM for its spotless-lib dependency if you bump either.
    implementation 'com.diffplug.spotless:spotless-lib:4.10.2'
    implementation 'com.diffplug.spotless:spotless-lib-extra:4.10.2'
    // must match both the jdt.core that build.gradle's eclipse('<N>') step provisions (no bundled
    // lockfile for 4.41 yet, so that's live P2 provisioning - see AGENTS.md), and the //DEPS
    // versions in scripts/src/{AddBracesFix,ClosingBraceFix}.java.
    implementation 'org.eclipse.jdt:org.eclipse.jdt.core:3.47.0'
    // must match the //DEPS version in scripts/src/DependencyOverrideCheck.java
    implementation 'org.apache.maven:maven-artifact:3.9.16'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
