org.gradle.parallel=true
org.gradle.vfs.watch=true
org.gradle.caching=true
# Caches the result of the configuration phase (build script evaluation, plugin application, task
# graph construction) to server/.gradle/configuration-cache. Only pays off across separate CI runs
# when that directory is persisted - see the actions/cache step in the CI workflow.
org.gradle.configuration-cache=true
# Needs for Red Hat's Project Manipulation Extension (PME) work
group=org.eclipse.openvsx
