# Run test classes concurrently: with one test JVM and ~36 distinct @SpringBootTest/@WebMvcTest
# context configurations, everything used to boot serially. Methods within a class stay on one
# thread (default), only classes fan out across cores.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic

# factor < 1: a full @SpringBootTest context can hold onto well over a hundred MB of heap while it's
# being built, and letting one thread per core build one concurrently caused an OutOfMemoryError under
# CI's heap limit once enough of them lined up at the same moment - not reproducible every run, only
# once several heavy contexts happened to boot simultaneously. Halving the thread count roughly halves
# how many can be mid-construction at once.
junit.jupiter.execution.parallel.config.dynamic.factor = 0.5
