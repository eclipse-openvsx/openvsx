# Run test classes concurrently: with one test JVM and ~36 distinct @SpringBootTest/@WebMvcTest
# context configurations, everything used to boot serially. Methods within a class stay on one
# thread (default), only classes fan out across cores.
#
# All @SpringBootTest/@WebMvcTest classes that share the Testcontainers Postgres/Timescale database
# (AbstractPostgresContainerTest) are @Isolated, so only the lightweight unit/@WebMvcTest tier actually
# runs concurrently under this - there's no local memory constraint worth guessing at, so this uses the
# full `dynamic` default (one thread per core). build.gradle overrides this with a small fixed thread
# count in CI specifically, where a full local machine's worth of concurrent context construction isn't
# available to absorb.
junit.jupiter.execution.parallel.enabled = true
junit.jupiter.execution.parallel.mode.default = same_thread
junit.jupiter.execution.parallel.mode.classes.default = concurrent
junit.jupiter.execution.parallel.config.strategy = dynamic
